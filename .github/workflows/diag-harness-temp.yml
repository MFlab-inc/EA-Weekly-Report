name: diag-harness-temp
# 一時調査用ワークフロー（10/19週パイプライン失敗の原因調査、しょうさん指示2026-10-17）。
# gb_boe_calendarの「表示ウィンドウが7日間隔でない」失敗の実際の原因を確認するため、
# events/upcoming-eventsの生HTMLの<title>タグと"w/b"出現箇所を直接ダンプする。
# User-Agentは本番harness.mjsと同じ自己開示UA（偽装なし）。調査終了後に削除する。
on:
  push:
    branches: [claude/ea-weekly-report-automation-lw6cio]
    paths:
      - '.github/workflows/diag-harness-temp.yml'

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/diag-boe-items.mjs
