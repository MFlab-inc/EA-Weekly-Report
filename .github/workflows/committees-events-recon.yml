# 一時ワークフロー（2026-09-27）: Treasury Committee代替API（committees-api.parliament.uk）の
# 未来イベント返却可否実測（scripts/phase1/source-recon-t.mjs）。
# 確認完了後、このファイルと.committees-events-recon-triggerは削除する
# （source-recon-t.mjs自体は監査記録として残す）。
name: committees-events-recon
on:
  push:
    paths:
      - '.committees-events-recon-trigger'
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - run: node scripts/phase1/source-recon-t.mjs
