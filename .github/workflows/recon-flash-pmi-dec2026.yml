# 一時調査ワークフロー（2026-11-28作成、しょうさん指示: us_flash_pmi/de_flash_pmi/eu_flash_pmi/
# gb_flash_pmiの2026年12月分をS&P Global公式カレンダー確認のうえ追加）。本サンドボックス環境は
# pmi.spglobal.com等へ直接到達できない（agent proxyの許可リスト外）ため、nz-stats-api-recon等と
# 同じ方式（GitHub Actions実ネットワーク経由）で確認する。data/・config/への書き込みは一切
# 行わない（調査専用、確認後に本ファイル自体を削除する）。
name: recon-flash-pmi-dec2026
on:
  workflow_dispatch: {}
jobs:
  recon:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: robots.txt確認
        run: |
          for host in "https://www.pmi.spglobal.com/robots.txt" "https://www.markiteconomics.com/robots.txt" "https://www.hcob-bank.com/robots.txt"; do
            echo "=== $host ==="
            curl -sS --max-time 15 -o /dev/null -w "HTTP:%{http_code}\n" -A "MFlab-EA-Weekly/1.0 (+https://github.com/MFlab-inc/EA-Weekly-Report; recon)" "$host" || echo "curl終了コード: $?"
          done
      - name: PMI by S&P Global release calendar（本体ページ）
        run: |
          curl -sSL --max-time 20 --max-redirs 5 -A "MFlab-EA-Weekly/1.0 (+https://github.com/MFlab-inc/EA-Weekly-Report; recon)" \
            "https://www.pmi.spglobal.com/Public/Release/ReleaseDates" -o /tmp/release-dates.html || echo "curl終了コード: $?"
          wc -c /tmp/release-dates.html || true
          python3 -c "
          import re
          try:
              html = open('/tmp/release-dates.html', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              print('ファイル無し（取得失敗）'); raise SystemExit
          text = re.sub(r'<[^>]+>', '\n', html)
          text = re.sub(r'\n\s*\n+', '\n', text)
          lines = [l.strip() for l in text.split(chr(10)) if l.strip()]
          print(f'行数: {len(lines)}')
          for i, l in enumerate(lines):
              if 'december' in l.lower() or 'dec' in l.lower() or '2026' in l:
                  print(f'[{i}] {l}')
          " || true
      - name: GB release dates PDF
        run: |
          curl -sSL --max-time 20 --max-redirs 5 -A "MFlab-EA-Weekly/1.0 (+https://github.com/MFlab-inc/EA-Weekly-Report; recon)" \
            "https://www.pmi.spglobal.com/Public/Home/PDF/UK_Rel_Dates" -o /tmp/uk-rel-dates.pdf || echo "curl終了コード: $?"
          file /tmp/uk-rel-dates.pdf || true
          wc -c /tmp/uk-rel-dates.pdf || true
          python3 -c "
          try:
              data = open('/tmp/uk-rel-dates.pdf','rb').read()
          except FileNotFoundError:
              print('ファイル無し（取得失敗）'); raise SystemExit
          print('先頭20バイト:', data[:20])
          " || true
      - name: press_release_hub
        run: |
          curl -sSL --max-time 20 --max-redirs 5 -A "MFlab-EA-Weekly/1.0 (+https://github.com/MFlab-inc/EA-Weekly-Report; recon)" \
            "https://www.pmi.spglobal.com/Public/Home/PressRelease" -o /tmp/press-hub.html || echo "curl終了コード: $?"
          wc -c /tmp/press-hub.html || true
