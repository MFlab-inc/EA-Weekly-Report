name: abs-trade-recon
on:
  push:
    paths: ['.abs-trade-recon-trigger']
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - run: npm ci
      - run: node scripts/phase1/source-recon-z.mjs
