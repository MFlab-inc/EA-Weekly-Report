# BOE（Bank of England）総裁級講演の取得経路実測用の一時ワークフロー（task #72、しょうさん指摘
# 2026-08-30: 8/31週Manus突合で9/4ベイリー総裁講演★★★の実漏れが観測されたため優先度引き上げ）。
# WebFetchはbankofengland.co.ukをブロックしているため、既存のmanus-diff-recon等と同じ方式
# （GitHub Actions実ネットワーク）で調査する。robots.txt許可確認・RSS候補URLの構造確認・
# 講演者名の抽出可否を確認する。調査完了後（見つかった/見つからなかったに関わらず）削除する。
# 起動方式: 開発ブランチへの `.boe-speeches-recon-trigger` 変更pushで起動する
name: boe-speeches-recon
on:
  push:
    branches: [claude/ea-weekly-report-automation-lw6cio]
    paths: ['.boe-speeches-recon-trigger']
permissions:
  contents: read
concurrency:
  group: boe-speeches-recon
  cancel-in-progress: false
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: robots.txt確認とRSS/HTML候補URLの構造調査
        run: |
          node -e '
            (async () => {
              const ua = { "User-Agent": "MFlab-EA-Weekly/1.0 (+https://github.com/MFlab-inc/EA-Weekly-Report; boe-speeches-recon)" };

              console.log("=== robots.txt ===");
              try {
                const r = await fetch("https://www.bankofengland.co.uk/robots.txt", { headers: ua });
                console.log("status:", r.status);
                console.log(await r.text());
              } catch (e) { console.log("エラー:", String(e && e.message || e)); }

              const candidates = [
                "https://www.bankofengland.co.uk/rss/speeches",
                "https://www.bankofengland.co.uk/rss/news",
                "https://www.bankofengland.co.uk/rss/publications",
                "https://www.bankofengland.co.uk/news/speeches",
              ];
              for (const url of candidates) {
                console.log(`\n=== ${url} ===`);
                try {
                  const res = await fetch(url, { headers: ua, redirect: "follow" });
                  console.log("status:", res.status, "final:", res.url, "content-type:", res.headers.get("content-type"));
                  if (!res.ok) continue;
                  const body = await res.text();
                  console.log("length:", body.length);
                  if (body.trim().startsWith("<?xml") || /<rss|<feed/i.test(body.slice(0, 500))) {
                    // RSS/Atom: 最初の3件のitem/entryブロックを丸ごと出力（タイトル・pubDate・リンク構造を確認するため）
                    const items = body.match(/<item>[\s\S]*?<\/item>|<entry>[\s\S]*?<\/entry>/g) || [];
                    console.log("item count (この抜粋内):", items.length);
                    items.slice(0, 3).forEach((it, i) => console.log(`--- item ${i} ---\n${it.slice(0, 1500)}`));
                  } else {
                    // HTML: <title>とbailey/Bailey近傍のテキストを抜粋
                    const text = body.replace(/<script[\s\S]*?<\/script>/gi, " ").replace(/<style[\s\S]*?<\/style>/gi, " ");
                    const baileyIdx = text.toLowerCase().indexOf("bailey");
                    if (baileyIdx >= 0) console.log("Bailey近傍抜粋:", text.slice(Math.max(0, baileyIdx - 200), baileyIdx + 200).replace(/<[^>]+>/g, " ").replace(/\s+/g, " "));
                    else console.log("(本文中に Bailey の文字列が見つからない)");
                  }
                } catch (e) {
                  console.log("エラー:", String(e && e.message || e));
                }
              }
            })();
          '
