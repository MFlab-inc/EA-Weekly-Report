# 8/24週Manus突合（しょうさん指摘2026-08-22）で判明した欠落項目の一次情報源ライブ確認用の
# 一時ワークフロー。task #41ライブ検証と同じ方式（GitHub Actions実ネットワーク）。
# 1回目の実行（run 32555169072）で東京都区部CPI・Stats NZ・FRED(PCE/GDP)は確認済み。
# 2回目はboj.or.jp講演・挨拶等カレンダーのみ再実行（1回目はShift_JIS想定decodeで文字化けし
# 検索キーワードがヒットしなかったため、UTF-8想定に修正して再実行）。
# 起動方式: 開発ブランチへの `.manus-diff-recon-trigger` 変更pushで起動する
# 本ワークフローは確認完了後に削除する。
name: manus-diff-recon
on:
  push:
    branches: [claude/ea-weekly-report-automation-lw6cio]
    paths: ['.manus-diff-recon-trigger']
permissions:
  contents: read
concurrency:
  group: manus-diff-recon
  cancel-in-progress: false
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - name: 日銀 公表予定カレンダー確認 (boj.or.jp/about/calendar/index.htm)
        run: |
          node -e '
            (async () => {
              const res = await fetch("https://www.boj.or.jp/about/calendar/index.htm", {
                headers: { "User-Agent": "MFlab-EA-Weekly/1.0 (+https://github.com/MFlab-inc/EA-Weekly-Report; manus-diff-recon)" },
              });
              console.log("status:", res.status, "content-type:", res.headers.get("content-type"));
              // 1回目のライブ確認でShift_JIS想定decodeが文字化けした（boj.or.jpは実際はUTF-8の可能性）。
              // res.text()はHTTPヘッダのcharsetかデフォルトUTF-8で復号するため、まずこちらを試す。
              const text = await res.text();
              const plain = text.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ");
              console.log(plain.slice(0, 3000));
            })();
          '
          sleep 1.5
      - name: 日銀 講演挨拶等一覧ページ確認 (koen_2026)
        run: |
          node -e '
            (async () => {
              for (const url of [
                "https://www.boj.or.jp/about/press/koen_2026/index.htm",
                "https://www.boj.or.jp/about/r_menu_koen/index.htm",
              ]) {
                try {
                  const res = await fetch(url, {
                    headers: { "User-Agent": "MFlab-EA-Weekly/1.0 (+https://github.com/MFlab-inc/EA-Weekly-Report; manus-diff-recon)" },
                  });
                  console.log("URL:", url, "status:", res.status, "content-type:", res.headers.get("content-type"));
                  if (res.ok) {
                    const text = await res.text();
                    const plain = text.replace(/<[^>]+>/g, " ").replace(/\s+/g, " ");
                    console.log("total plain length:", plain.length);
                    const keywords = ["埼玉", "氷見野", "金融経済懇談会", "副総裁", "8月27日", "08/27"];
                    let anyFound = false;
                    for (const kw of keywords) {
                      const idx = plain.indexOf(kw);
                      if (idx >= 0) {
                        anyFound = true;
                        console.log(`"${kw}" を含む抜粋: ` + plain.slice(Math.max(0, idx - 300), idx + 300));
                      }
                    }
                    if (!anyFound) {
                      console.log("上記キーワードはいずれも見つかりませんでした。本文の複数箇所を抜粋:");
                      console.log("--- 0-2000 ---");
                      console.log(plain.slice(0, 2000));
                      console.log("--- 2000-5000 ---");
                      console.log(plain.slice(2000, 5000));
                      console.log("--- 5000-8000 ---");
                      console.log(plain.slice(5000, 8000));
                    }
                  }
                } catch (e) {
                  console.log("URL:", url, "error:", String(e.message || e));
                }
                await new Promise(r => setTimeout(r, 1500));
              }
            })();
          '
