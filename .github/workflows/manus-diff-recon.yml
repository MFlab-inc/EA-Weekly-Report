# 8/24週Manus突合（しょうさん指摘2026-08-22）で判明した欠落項目の一次情報源ライブ確認用の
# 一時ワークフロー。task #41ライブ検証と同じ方式（GitHub Actions実ネットワーク）。
# 1回目の実行（run 32555169072）で東京都区部CPI・Stats NZ・FRED(PCE/GDP)は確認済み。
# 2回目の実行（run 32555595885）でboj.or.jp/about/calendar/index.htm（公表予定、毎週金曜更新）が
# UTF-8であることが判明し、「27日（木） 10:30」というエントリの存在まで確認できたが、
# slice(0,3000)の範囲外でイベント名自体が切れてしまった。3回目はその続きだけを抜粋する。
# 起動方式: 開発ブランチへの `.manus-diff-recon-trigger` 変更pushで起動する
# 本ワークフローは確認完了後に削除する。
name: manus-diff-recon
on:
  push:
    branches: [claude/ea-weekly-report-automation-lw6cio]
    paths: ['.manus-diff-recon-trigger']
permissions:
  contents: read
concurrency:
  group: manus-diff-recon
  cancel-in-progress: false
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - name: 日銀 公表予定カレンダー確認 (boj.or.jp/about/calendar/index.htm)
        run: |
          node -e '
            (async () => {
              const res = await fetch("https://www.boj.or.jp/about/calendar/index.htm", {
                headers: { "User-Agent": "MFlab-EA-Weekly/1.0 (+https://github.com/MFlab-inc/EA-Weekly-Report; manus-diff-recon)" },
              });
              console.log("status:", res.status, "content-type:", res.headers.get("content-type"));
              // 1回目のライブ確認でShift_JIS想定decodeが文字化けした（boj.or.jpは実際はUTF-8の可能性）。
              // res.text()はHTTPヘッダのcharsetかデフォルトUTF-8で復号するため、まずこちらを試す。
              const text = await res.text();
              console.log("raw html length:", text.length);
              // extractor実装のため、フラット化前の生HTML構造（テーブルのタグ・class名）を確認する。
              // 「氷見野」を含む<tr>要素の周辺タグ構造をそのまま出力する
              const idx = text.indexOf("氷見野");
              console.log("=== 氷見野を含む生HTML抜粋（前後1500文字） ===");
              console.log(idx >= 0 ? text.slice(Math.max(0, idx - 1500), idx + 500) : "(見つかりません)");
            })();
          '
