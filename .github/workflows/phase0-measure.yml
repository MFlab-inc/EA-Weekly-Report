# Phase 0 実測用の一時ワークフロー
# 目的: HANDOFF.md §3 の要実測項目1〜3を本番と同じActionsランナー上で計測する。
#
# 起動方式: 開発ブランチへの `.phase0-trigger` 変更push で起動する。
#   （workflow_dispatchはデフォルトブランチにワークフローが存在しないと使えないため。
#     本リポジトリはmainに触れない運用のためpushトリガーを採用）
#   .phase0-trigger の内容（JSON）: {"targets":"all|ff-only","note":"...","reuse_run_id":""}
#
# - 生データはリポジトリにコミットせず、artifact（保持3日）にのみ保存する
#   （みんかぶ許諾が確定するまで、取得HTMLのリポジトリ内保存は行わない）
# - ログには構造分析・件数・最小限の抜粋のみを出力する
# - reuse_run_id を指定すると過去runのartifactを再利用し、外部再取得を行わない（再解析用）
# Phase 0 完了後にこのファイルは削除する。
name: phase0-measure
on:
  push:
    branches: [claude/ea-weekly-report-automation-lw6cio]
    paths: ['.phase0-trigger']
  workflow_dispatch:
    inputs:
      targets:
        description: '取得対象 (all=みんかぶ+FF / ff-only=FFのみ)'
        type: choice
        options: [all, ff-only]
        default: all
      note:
        description: '計測メモ（例: saturday-0806jst）'
        type: string
        default: ''
      reuse_run_id:
        description: '過去runのartifactを再利用する場合そのrun ID（外部取得なしで再解析）'
        type: string
        default: ''
permissions:
  contents: read
  actions: read
concurrency:
  group: phase0-measure
  cancel-in-progress: false
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Resolve config (.phase0-trigger or dispatch inputs)
        id: cfg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "targets=${{ inputs.targets }}" >> "$GITHUB_OUTPUT"
            echo "note=${{ inputs.note }}" >> "$GITHUB_OUTPUT"
            echo "reuse_run_id=${{ inputs.reuse_run_id }}" >> "$GITHUB_OUTPUT"
          else
            node -e '
              const fs = require("fs");
              let cfg = {};
              try { cfg = JSON.parse(fs.readFileSync(".phase0-trigger", "utf8")); } catch (e) {}
              const out = [
                "targets=" + (cfg.targets || "all"),
                "note=" + (cfg.note || ""),
                "reuse_run_id=" + (cfg.reuse_run_id || ""),
              ].join("\n") + "\n";
              fs.appendFileSync(process.env.GITHUB_OUTPUT, out);
            '
          fi
      - name: Reuse artifact from previous run
        if: ${{ steps.cfg.outputs.reuse_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          name: phase0-raw
          path: phase0-out
          run-id: ${{ steps.cfg.outputs.reuse_run_id }}
          github-token: ${{ github.token }}
      - name: Measure
        run: node scripts/phase0/phase0.mjs --targets='${{ steps.cfg.outputs.targets }}' --note='${{ steps.cfg.outputs.note }}'
      - name: Upload raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase0-raw
          path: phase0-out
          retention-days: 3
          if-no-files-found: warn
