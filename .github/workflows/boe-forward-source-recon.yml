# 一時ワークフロー（2026-09-26）: gb_boe_speeches（RSS）が事前告知型か実施後掲載型かの切り分け、
# および9/25ベイリー総裁の登壇疑いの追加確認（scripts/phase1/source-recon-p.mjs）。
# 確認完了後、このファイルと.boe-forward-source-recon-triggerは削除する
# （source-recon-p.mjs自体は監査記録として残す）。
name: boe-forward-source-recon
on:
  push:
    paths:
      - '.boe-forward-source-recon-trigger'
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - run: node scripts/phase1/source-recon-p.mjs
