# 米フラッシュPMI・EIA週間石油在庫統計・NY連銀総裁講演の一次情報源実測用の一時ワークフロー
# （2026-09-19、しょうさん差し戻し: 対話セッションのサンドボックスがpmi.spglobal.com・eia.gov・
# newyorkfed.orgをブロックしていることを理由に調査を先送りしたことへの指摘。過去のBOE講演
# 実測[boe-speeches-recon]等と同じ方式（GitHub Actions実ネットワーク）で改めて実測する）。
# scripts/phase1/source-recon-m.mjs参照。調査完了後（見つかった/見つからなかったに関わらず）
# 本ワークフロー・トリガーファイルとも削除する。
# 起動方式: 開発ブランチへの `.us-sources-recon-trigger` 変更pushで起動する
name: us-sources-recon
on:
  push:
    branches: [claude/ea-weekly-report-automation-lw6cio]
    paths: ['.us-sources-recon-trigger']
permissions:
  contents: read
concurrency:
  group: us-sources-recon
  cancel-in-progress: false
jobs:
  recon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: 米フラッシュPMI・EIA週間石油在庫・NY連銀講演の実測
        run: node scripts/phase1/source-recon-m.mjs
