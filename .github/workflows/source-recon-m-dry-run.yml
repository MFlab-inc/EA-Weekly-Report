# task #53ライブ検証用の一時ワークフロー（2026-08-15）。
# しょうさん指摘: Ifoの「Calendar of Events and Release Dates」の実URL未確認のため、
# 有力候補ifo.de/en/eventsを実ネットワークで検証する。検証完了後は削除すること。
name: source-recon-m-dry-run
on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/ea-weekly-report-automation-lw6cio
    paths:
      - '.github/workflows/source-recon-m-dry-run.yml'
      - 'scripts/phase1/source-recon-l.mjs'
permissions:
  contents: read
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: source-recon-l (Ifo events候補を含む)
        run: node scripts/phase1/source-recon-l.mjs
