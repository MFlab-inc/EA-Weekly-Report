# テスト専用CI（2026-08-15新設、2026-08-15再定義でPlaywright検証を統合）。
# npm test（純粋関数・ロジックのユニットテスト）＋Playwrightを使うモバイル多幅レイアウト検証まで
# 実行する。配信用ワークフロー（weekly.yml、2026-08-17に.github/workflows/へ移設・本番有効化済み）
# とは無関係にpush/PRで常時実行してよい。
# ネットワークアクセスは「テスト自体の挙動」としては発生しない設計を維持している
# （外部サイトへの実アクセスが必要な箇所はfetchImplモックで代替済み。policy-lintのリンク到達性
# チェックはWARNING止まりで判定に影響しない）。npm ci・Playwrightブラウザのインストールは
# CIインフラのセットアップであり「テストの挙動」ではないため対象外（npm ciのnpmレジストリ
# アクセスと同種）。Secrets不使用・成果物のコミットも行わない。
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Chromium (モバイル多幅レイアウト検証に使用)
        run: npx playwright install --with-deps chromium
      - run: npm test
