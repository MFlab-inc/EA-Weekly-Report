# テスト専用CI（2026-08-15、しょうさん指示）。npm testのみを実行する軽量ワークフロー。
# 配信用ワークフロー（weekly.yml）の移設は別件（未実施・workflows-draft/のまま）であり、
# 本ワークフローはそれとは無関係にpush/PRで常時実行してよい（ネットワークアクセス不要な
# 純粋関数テストのみで構成されているため。テスト自体が外部サイトへ実アクセスするような
# ケースはfetchImplモックで代替済み）。Secrets不使用・成果物のコミットも行わない。
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
