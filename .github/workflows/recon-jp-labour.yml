# 一時調査ワークフロー（2026-11-28作成、しょうさん依頼: 完全失業率・中国PMI・米PMI確報の自動取得化）。
# 中国国務院弁公庁の祝日通知（2027年）を、本番と同じGitHub Actions実ネットワーク経由で
# 直接取得し、本文テキストをログへ出すだけ。data/・config/への書き込みは一切しない。
# 作業用ブランチへのpushでのみ動く（mainには入れない。確認後に本ファイルを削除する）。
name: recon-jp-labour
on:
  push:
    branches: [claude/ea-weekly-report-automation-lw6cio-auto-indicators]
    paths: ['.github/workflows/recon-jp-labour.yml']
jobs:
  recon:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 国务院办公厅 2027年部分节假日安排通知（gov.cn）
        run: |
          for url in \
            "https://www.gov.cn/zhengce/content/202611/content_7085101.htm" \
            "https://www.gov.cn/zhengce/content/202511/content_7047090.htm"; do
            echo "=== ${url} ==="
            curl -sSL --max-time 25 -o /tmp/page.html -w "HTTP:%{http_code} type:%{content_type} size:%{size_download}\n" \
              -A "MFlab-EA-Weekly/1.0 (+https://github.com/MFlab-inc/EA-Weekly-Report; recon)" "$url" || echo "curl終了コード: $?"
            python3 -c "
          import re, html as h
          raw = open('/tmp/page.html','rb').read()
          t = raw.decode('utf-8', 'replace')
          t = re.sub(r'(?is)<(script|style)[^>]*>.*?</\1>', ' ', t)
          t = h.unescape(re.sub(r'<[^>]+>', '\n', t))
          lines = [l.strip() for l in t.split(chr(10)) if l.strip()]
          keep = [l for l in lines if any(k in l for k in ('元旦','春节','清明','劳动节','端午','中秋','国庆','上班','放假','国办发明电','年'))]
          print(chr(10).join(keep[:80]))
          " || true
          done
