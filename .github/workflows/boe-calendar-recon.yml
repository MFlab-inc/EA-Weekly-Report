# 一時ワークフロー（2026-09-26）: BOE事前告知カレンダー実装に向けた生HTML構造確認、および
# UK議会Treasury Committee代替一次ソース（committees-api.parliament.uk）の到達性確認
# （scripts/phase1/source-recon-q.mjs）。
# 確認完了後、このファイルと.boe-calendar-recon-triggerは削除する
# （source-recon-q.mjs自体は監査記録として残す）。
name: boe-calendar-recon
on:
  push:
    paths:
      - '.boe-calendar-recon-trigger'
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - run: node scripts/phase1/source-recon-q.mjs
