# 一時調査ワークフロー（2026-11-22作成、しょうさん指示: config/official-sources.jsonの
# 残量監視WARN対応のための年次スケジュール確認）。本サンドボックス環境はstats.govt.nz・
# stats.gov.cnへ直接到達できない（agent proxyの許可リストに無い）ため、既存のnz-stats-api-recon等と
# 同じ「GitHub Actions実ネットワーク経由で一時調査し、結果をログに出す」方式を使う。
# data/・output/・config/への書き込みは一切行わない（調査専用、確認後に本ファイル自体を削除する）。
name: recon-annual-schedule-2026-11
on:
  workflow_dispatch: {}
jobs:
  recon:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Stats NZ calendar-export（2026年12月・GDP確認。301リダイレクト[末尾スラッシュ]をcurl -Lで追従・タイムアウト設定）
        run: |
          echo "=== calendar-export?month=12&year=2026（-Lでリダイレクト追従、--max-time 25） ==="
          curl -sSL --max-time 25 --max-redirs 5 -D /tmp/nz-2026-12-headers.txt -A "MFlab-EA-Weekly/1.0 (+https://github.com/MFlab-inc/EA-Weekly-Report; recon)" \
            "https://www.stats.govt.nz/release-calendar/calendar-export?month=12&year=2026" -o /tmp/nz-2026-12.ics || echo "curl終了コード: $?"
          echo "--- レスポンスヘッダー ---"
          cat /tmp/nz-2026-12-headers.txt || true
          echo "--- ファイルサイズ ---"
          wc -c /tmp/nz-2026-12.ics || true
          echo "--- HTTP status/size ---"
          wc -l /tmp/nz-2026-12.ics || true
          echo "--- 全SUMMARY/DTSTART一覧 ---"
          python3 -c "
          import re
          text = open('/tmp/nz-2026-12.ics', encoding='utf-8', errors='replace').read()
          events = text.split('BEGIN:VEVENT')
          for ev in events[1:]:
              m_sum = re.search(r'SUMMARY:(.*)', ev)
              m_start = re.search(r'DTSTART[^:]*:(.*)', ev)
              m_end = re.search(r'DTEND[^:]*:(.*)', ev)
              summ = m_sum.group(1).strip() if m_sum else '?'
              start = m_start.group(1).strip() if m_start else '?'
              end = m_end.group(1).strip() if m_end else '?'
              print(f'{start} - {end} | {summ}')
          "
          echo "--- GDP関連のみ（SUMMARYに'gross domestic product'または'GDP'を含む行） ---"
          python3 -c "
          import re
          text = open('/tmp/nz-2026-12.ics', encoding='utf-8', errors='replace').read()
          events = text.split('BEGIN:VEVENT')
          for ev in events[1:]:
              m_sum = re.search(r'SUMMARY:(.*)', ev)
              summ = m_sum.group(1).strip() if m_sum else ''
              if 'gross domestic product' in summ.lower() or re.search(r'\bgdp\b', summ.lower()):
                  print('---VEVENT---')
                  print(ev[:800])
          "
      - name: RBNZ GDP系列ページ・Stats NZ GDP指標ページ（次回更新日の直接確認）
        run: |
          echo "=== RBNZ GDP series page ==="
          curl -sSL --max-time 20 --max-redirs 5 -A "MFlab-EA-Weekly/1.0 (+https://github.com/MFlab-inc/EA-Weekly-Report; recon)" \
            "https://www.rbnz.govt.nz/statistics/series/economic-indicators/gross-domestic-product" -o /tmp/rbnz-gdp.html || echo "curl終了コード: $?"
          wc -c /tmp/rbnz-gdp.html || true
          python3 -c "
          import re
          try:
              html = open('/tmp/rbnz-gdp.html', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              print('ファイル無し（取得失敗）')
              raise SystemExit
          text = re.sub(r'<[^>]+>', '\n', html)
          text = re.sub(r'\n\s*\n+', '\n', text)
          lines = [l.strip() for l in text.split(chr(10)) if l.strip()]
          for i, l in enumerate(lines):
              if 'release' in l.lower() or 'update' in l.lower() or 'december' in l.lower() or 'quarter' in l.lower():
                  print(f'[{i}] {l}')
          " || true
          echo "=== Stats NZ GDP indicator page ==="
          curl -sSL --max-time 20 --max-redirs 5 -A "MFlab-EA-Weekly/1.0 (+https://github.com/MFlab-inc/EA-Weekly-Report; recon)" \
            "https://www.stats.govt.nz/indicators/gross-domestic-product-gdp/" -o /tmp/statsnz-gdp-indicator.html || echo "curl終了コード: $?"
          wc -c /tmp/statsnz-gdp-indicator.html || true
          python3 -c "
          import re
          try:
              html = open('/tmp/statsnz-gdp-indicator.html', encoding='utf-8', errors='replace').read()
          except FileNotFoundError:
              print('ファイル無し（取得失敗）')
              raise SystemExit
          text = re.sub(r'<[^>]+>', '\n', html)
          text = re.sub(r'\n\s*\n+', '\n', text)
          lines = [l.strip() for l in text.split(chr(10)) if l.strip()]
          for i, l in enumerate(lines):
              if 'release' in l.lower() or 'update' in l.lower() or 'december' in l.lower() or 'quarter' in l.lower():
                  print(f'[{i}] {l}')
          " || true
      - name: Stats NZ calendar-export（2027年1月・CPI確認。-Lでリダイレクト追従・タイムアウト設定）
        run: |
          echo "=== calendar-export?month=1&year=2027（-Lでリダイレクト追従、--max-time 25） ==="
          curl -sSL --max-time 25 --max-redirs 5 -A "MFlab-EA-Weekly/1.0 (+https://github.com/MFlab-inc/EA-Weekly-Report; recon)" \
            "https://www.stats.govt.nz/release-calendar/calendar-export?month=1&year=2027" -o /tmp/nz-2027-01.ics || echo "curl終了コード: $?"
          wc -l /tmp/nz-2027-01.ics || true
          echo "--- 全SUMMARY/DTSTART一覧 ---"
          python3 -c "
          import re
          text = open('/tmp/nz-2027-01.ics', encoding='utf-8', errors='replace').read()
          events = text.split('BEGIN:VEVENT')
          for ev in events[1:]:
              m_sum = re.search(r'SUMMARY:(.*)', ev)
              m_start = re.search(r'DTSTART[^:]*:(.*)', ev)
              summ = m_sum.group(1).strip() if m_sum else '?'
              start = m_start.group(1).strip() if m_start else '?'
              print(f'{start} | {summ}')
          "
          echo "--- CPI関連のみ ---"
          python3 -c "
          import re
          text = open('/tmp/nz-2027-01.ics', encoding='utf-8', errors='replace').read()
          events = text.split('BEGIN:VEVENT')
          for ev in events[1:]:
              m_sum = re.search(r'SUMMARY:(.*)', ev)
              summ = m_sum.group(1).strip() if m_sum else ''
              if 'consumer price index' in summ.lower() or re.search(r'\bcpi\b', summ.lower()):
                  print('---VEVENT---')
                  print(ev[:800])
          "
