# 一時調査ワークフロー（2026-11-22作成、しょうさん指示: config/official-sources.jsonの
# 残量監視WARN対応のための年次スケジュール確認）。本サンドボックス環境はstats.govt.nz・
# stats.gov.cnへ直接到達できない（agent proxyの許可リストに無い）ため、既存のnz-stats-api-recon等と
# 同じ「GitHub Actions実ネットワーク経由で一時調査し、結果をログに出す」方式を使う。
# data/・output/・config/への書き込みは一切行わない（調査専用、確認後に本ファイル自体を削除する）。
name: recon-annual-schedule-2026-11
on:
  workflow_dispatch: {}
jobs:
  recon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Stats NZ calendar-export（2026年12月・GDP確認。301リダイレクト[末尾スラッシュ]をcurl -Lで追従）
        run: |
          echo "=== calendar-export?month=12&year=2026（-Lでリダイレクト追従） ==="
          curl -sSL -A "MFlab-EA-Weekly/1.0 (+https://github.com/MFlab-inc/EA-Weekly-Report; recon)" \
            "https://www.stats.govt.nz/release-calendar/calendar-export?month=12&year=2026" -o /tmp/nz-2026-12.ics
          echo "--- HTTP status/size ---"
          wc -l /tmp/nz-2026-12.ics || true
          echo "--- 全SUMMARY/DTSTART一覧 ---"
          python3 -c "
          import re
          text = open('/tmp/nz-2026-12.ics', encoding='utf-8', errors='replace').read()
          events = text.split('BEGIN:VEVENT')
          for ev in events[1:]:
              m_sum = re.search(r'SUMMARY:(.*)', ev)
              m_start = re.search(r'DTSTART[^:]*:(.*)', ev)
              m_end = re.search(r'DTEND[^:]*:(.*)', ev)
              summ = m_sum.group(1).strip() if m_sum else '?'
              start = m_start.group(1).strip() if m_start else '?'
              end = m_end.group(1).strip() if m_end else '?'
              print(f'{start} - {end} | {summ}')
          "
          echo "--- GDP関連のみ（SUMMARYに'gross domestic product'または'GDP'を含む行） ---"
          python3 -c "
          import re
          text = open('/tmp/nz-2026-12.ics', encoding='utf-8', errors='replace').read()
          events = text.split('BEGIN:VEVENT')
          for ev in events[1:]:
              m_sum = re.search(r'SUMMARY:(.*)', ev)
              summ = m_sum.group(1).strip() if m_sum else ''
              if 'gross domestic product' in summ.lower() or re.search(r'\bgdp\b', summ.lower()):
                  print('---VEVENT---')
                  print(ev[:800])
          "
      - name: Stats NZ calendar-export（2027年1月・CPI確認。-Lでリダイレクト追従）
        run: |
          echo "=== calendar-export?month=1&year=2027（-Lでリダイレクト追従） ==="
          curl -sSL -A "MFlab-EA-Weekly/1.0 (+https://github.com/MFlab-inc/EA-Weekly-Report; recon)" \
            "https://www.stats.govt.nz/release-calendar/calendar-export?month=1&year=2027" -o /tmp/nz-2027-01.ics
          wc -l /tmp/nz-2027-01.ics || true
          echo "--- 全SUMMARY/DTSTART一覧 ---"
          python3 -c "
          import re
          text = open('/tmp/nz-2027-01.ics', encoding='utf-8', errors='replace').read()
          events = text.split('BEGIN:VEVENT')
          for ev in events[1:]:
              m_sum = re.search(r'SUMMARY:(.*)', ev)
              m_start = re.search(r'DTSTART[^:]*:(.*)', ev)
              summ = m_sum.group(1).strip() if m_sum else '?'
              start = m_start.group(1).strip() if m_start else '?'
              print(f'{start} | {summ}')
          "
          echo "--- CPI関連のみ ---"
          python3 -c "
          import re
          text = open('/tmp/nz-2027-01.ics', encoding='utf-8', errors='replace').read()
          events = text.split('BEGIN:VEVENT')
          for ev in events[1:]:
              m_sum = re.search(r'SUMMARY:(.*)', ev)
              summ = m_sum.group(1).strip() if m_sum else ''
              if 'consumer price index' in summ.lower() or re.search(r'\bcpi\b', summ.lower()):
                  print('---VEVENT---')
                  print(ev[:800])
          "
