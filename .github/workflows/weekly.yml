# 週次レポート自動生成（本番）。2026-08-17、PR #2マージ後に .github/workflows/ へ移設して有効化。
name: weekly-report
on:
  schedule:
    - cron: '6 23 * * 5'    # 土曜 08:06 JST（本番）
    - cron: '41 23 * * 5'   # 土曜 08:41 JST（保険。冪等ガードで二重生成防止）
    - cron: '23 23 * * 0'   # 月曜 08:23 JST（SPEC §3.3月曜事後突合。人気分[0/5の倍数・15・30・45]を回避）
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: '既存台帳の有無・生成元コミットに関わらず対象週を強制的に再生成する（コード修正を反映させたい手動再実行時に使用）'
        type: boolean
        default: false
      acknowledge_low_volume:
        description: '件数下限チェックのみが理由のREVIEW_REQUIRED（output/review/配下の確認用HTMLで内容確認済み）を、公開してよいものとして確定する。監査エラーによるHOLDはこの入力では絶対に公開されない'
        type: boolean
        default: false
      deploy_pages_only:
        description: '新しい生成を一切行わず、現在のmain（output/配下）の内容でGitHub Pagesのプレビュー一覧だけを再デプロイする（buildジョブ自体をスキップする。対象週の先取り生成を防ぐため、force_regenerate/acknowledge_low_volumeを同時指定しても無視される）'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: weekly-report
  cancel-in-progress: false
jobs:
  build:
    # workflow_dispatch（手動）またはSaturdayの2本のcron（本番・保険）でのみ実行する。
    # 月曜cron（FF事後突合専用）ではこのジョブを起動しない。
    # 2026-10-08追加: deploy_pages_only指定時はこのジョブ自体をスキップする（新しい生成を
    # 一切行わず、現在のmainの内容だけでPagesを再デプロイしたいケース向け。しょうさん指摘:
    # 木曜等の平日にdeploy_pages_onlyなしでworkflow_dispatchすると対象週（次週）を
    # 先取り生成してしまうため、再デプロイだけしたい場合に生成を確実に回避する手段が必要）
    if: (github.event_name == 'workflow_dispatch' || github.event.schedule != '23 23 * * 0') && github.event.inputs.deploy_pages_only != 'true'
    runs-on: ubuntu-latest
    # 2026-10-03追加（しょうさん指摘: 10/5週の本番・保険cron両方がHOLDで失敗したが、通知の
    # 仕組みが無くしょうさんが自ら確認するまで誰も気づけなかった）。失敗時にIssueを自動作成する
    # ステップ（末尾、if: failure()）がissues: writeを必要とするため、job-level permissionsで
    # 明示する（job-levelはworkflow-levelとマージではなく置き換えのため、contents: writeも
    # 再掲する必要がある。monday-ff-cross-checkジョブと同じ理由）
    permissions:
      contents: write
      issues: write
    # 2026-10-08追加（しょうさん指摘: deploy-pagesジョブのチェックアウトがgithub.sha
    # [このworkflow runが起動した時点のコミット]を使っており、このbuildジョブが
    # commit outputs等で新たにpushしたコミットを反映しないまま1週遅れでPagesを生成する
    # バグがあった。実際に10/5週生成後のdeploy-pagesの実行ログでpages_build_versionが
    # pushの前のコミットSHAのままだったことを確認済み）。このジョブの最終的なHEAD
    # （commit outputs等で何かpushしていればそのコミット、何も変化が無ければ元のまま）を
    # 記録し、deploy-pagesが必ずこの時点のHEADをチェックアウトするようにする
    outputs:
      final_sha: ${{ steps.final_sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - run: npm ci
      - name: Install Playwright Chromium (モバイル多幅レイアウト検証に使用)
        run: npx playwright install --with-deps chromium
      # 冪等チェック（2026-08-17是正、しょうさん指摘: 保険cron[08:41]の二重生成防止が
      # 実働するか確認してほしいとの依頼を受けて検証した結果、当初の実装
      # [commit outputsステップのgit diff --cached --quietのみに依存]は不十分と判明したため
      # 修正。台帳meta.generated_atが実行のたびに異なる値になるため、pipelineを2回とも
      # 最後まで実行してからでは差分が必ず非空になり、08:41の保険runが常に重複コミットを
      # 作ってしまう構造的な欠陥があった。concurrency: group: weekly-report（同一workflow内で
      # cancel-in-progress: false）により08:06のrunが完全終了する[pushまで含む]まで08:41は
      # 開始しないため、この時点のcheckoutで対象週の台帳ファイルが既にリポジトリに存在するかを
      # 判定すれば安全に重複実行を検出できる。
      #
      # 2026-08-29再是正（しょうさん指摘）: 上記の「ファイルの存在有無だけを見る」実装には
      # 2つの盲点があった。(1) 手動実行が対象週を先取り生成すると、その後コードを何度修正して
      # mainへマージしても、Saturdayの本番cronが「もう存在する」と誤判定して永久にスキップし
      # 続ける（8/17の手動実行が8/24週を先取り生成し、8/22・8/24の3回のcronすべてが
      # 無反応にスキップした実例で発覚）。(2) コード修正を反映させたい狙いの手動再実行が
      # 効かない。対策として台帳meta.generated_from_commitに生成時のコミットSHAを記録し、
      # 「対象週ファイルが存在し、かつ生成元コミットが現在のHEADと一致する」場合のみスキップする
      # 方式に変更した。
      #
      # 2026-09-06再々是正（task #92、しょうさん指摘: 9/5の本番→保険cron連続実行で発覚）:
      # 上記のコミットSHA比較方式には別の盲点があった。本番cron（08:06 JST）がpipeline実行後の
      # commit outputsステップでdata/・output/をコミットするとHEADが進む。32分後の保険cron
      # （08:41 JST）がその新しいHEADをチェックアウトすると、台帳に記録済みのgenerated_from_commit
      # （本番cronのチェックアウト時点のSHA＝古い方）と現在のHEAD（本番cron自身のコミットで
      # 進んだ新しい方）が必ず不一致になり、コードが一切変わっていなくても保険cronが毎回
      # 再生成してしまっていた（実害は無かったが「二重生成防止」という設計目的が機能していない
      # 状態だった）。コミットSHAは「パイプラインの出力に影響するファイルが変わったか」の代理
      # 指標として不適切（パイプライン自身の書き込みでも変わってしまうため）と判断し、
      # scripts/lib/pipeline-code-hash.jsが計算する専用ハッシュ（scripts/・config/・
      # package.json・package-lock.json・.github/workflows/weekly.yml自身のみを対象とし、
      # data/・output/は対象外）による比較に置き換えた。これにより:
      # - 8/22の過剰スキップ（コードが変わったのにスキップし続ける）→ ハッシュが変わるので
      #   正しく再生成される
      # - 9/5の過小スキップ（コードが変わっていないのに毎回再生成する）→ data/・output/への
      #   書き込みはハッシュに影響しないので正しくスキップされる
      # の両方が同時に解消される。ハッシュ対象範囲の定義そのものが「何が変わったら再生成すべきか」
      # の判断基準になるため、範囲を変更する場合はpipeline-code-hash.jsのコメント・
      # docs/ledger-schema.mdの該当記述もあわせて更新すること。generated_from_commitは
      # 「実際にどのコミットが生成したか」を追跡する記録用フィールドとして引き続き記録する。
      # workflow_dispatchのforce_regenerateはこの判定自体を明示的にバイパスする
      - name: 冪等チェック（対象週の台帳が現在のコードで生成済みなら以降のpipelineをスキップ）
        id: idempotency
        run: |
          TARGET_WEEK_START=$(node -e "console.log(require('./scripts/lib/dates').getTargetWeek().targetWeekStart)")
          echo "target_week_start=${TARGET_WEEK_START}" >> "$GITHUB_OUTPUT"
          LEDGER_PATH="data/ledger/${TARGET_WEEK_START}.json"
          CURRENT_CODE_HASH=$(node -e "console.log(require('./scripts/lib/pipeline-code-hash.js').computePipelineCodeHash())")
          if [ "${{ github.event.inputs.force_regenerate }}" = "true" ]; then
            echo "already_generated=false" >> "$GITHUB_OUTPUT"
            echo "force_regenerateが指定されたため、既存台帳の有無に関わらず再生成します"
          elif [ -f "$LEDGER_PATH" ]; then
            EXISTING_CODE_HASH=$(node -e "
              const fs = require('fs');
              try {
                const j = JSON.parse(fs.readFileSync('$LEDGER_PATH', 'utf8'));
                console.log(j.meta && j.meta.generated_from_code_hash || '');
              } catch (e) { console.log(''); }
            ")
            if [ -n "$EXISTING_CODE_HASH" ] && [ "$EXISTING_CODE_HASH" = "$CURRENT_CODE_HASH" ]; then
              echo "already_generated=true" >> "$GITHUB_OUTPUT"
              echo "対象週(${TARGET_WEEK_START})は現在のパイプラインコード(hash=${CURRENT_CODE_HASH})で生成済み。今回のrunはスキップします（保険cronの二重生成防止）"
            else
              echo "already_generated=false" >> "$GITHUB_OUTPUT"
              echo "対象週(${TARGET_WEEK_START})の台帳は存在しますが、生成元コードハッシュ(${EXISTING_CODE_HASH:-不明。旧形式の台帳})が現在のコード(${CURRENT_CODE_HASH})と異なるため再生成します"
            fi
          else
            echo "already_generated=false" >> "$GITHUB_OUTPUT"
          fi
      # 2026-10-08追加（しょうさん指摘: acknowledge_low_volumeで再実行すると、PR #39時点の実装は
      # collect.mjsを再実行してしまい、レビュー時点から外部ソースの予定が変わっていた場合、
      # 確認していない内容がそのまま公開されてしまう構造的リスクがあった）。
      # しょうさん指示の方式(a)「再収集せず、レビュー時の台帳・HTMLをそのまま本番へ昇格する」を
      # 採用する。force_regenerateが指定されていない・かつ対象週のレビュー済み台帳
      # （output/review/ledger-<週>.json、下のREVIEW_REQUIREDステップが書き出す）が存在する場合、
      # pipelineステップ（collect.mjsを含む）を一切実行せず、レビュー済みファイルをそのまま
      # gate.mjsで再判定（同一データなので決定的にPUBLISH_READYになる。audit系checkも含め
      # 全て再実行することで、レビュー後にファイルが壊れていないかの最終確認にもなる）した上で
      # 本番パスへコピーする。
      # - force_regenerate:true指定時は常に新規生成（レビュー有無に関わらず最新データを取り直す
      #   明示的な意図のため、promoteはスキップしpipelineへフォールバックする）
      # - レビュー済みファイルが無い場合（レビューを経ずacknowledge_low_volumeのみを初回から
      #   付けて実行した等）は、collect〜gateを1回で通して実行するためドリフトは発生しない
      #   （収集と判定が同一run内で同時に起きるため、「後で確認」という時間差自体が無い）
      - name: 確認済み（acknowledge_low_volume）の場合、レビュー済み台帳・HTMLを再収集せず本番へ昇格
        id: promote
        if: steps.idempotency.outputs.already_generated == 'false' && github.event.inputs.acknowledge_low_volume == 'true' && github.event.inputs.force_regenerate != 'true'
        run: |
          TARGET_WEEK_START="${{ steps.idempotency.outputs.target_week_start }}"
          REVIEW_LEDGER="output/review/ledger-${TARGET_WEEK_START}.json"
          REVIEW_HTML="output/review/ea-weekly-${TARGET_WEEK_START//-/}.html"
          if [ -f "$REVIEW_LEDGER" ] && [ -f "$REVIEW_HTML" ]; then
            echo "レビュー済みの台帳・HTML（${REVIEW_LEDGER}）が見つかりました。再収集せずそのまま本番へ昇格します（確認後に予定が変わっていても、未確認の内容を公開してしまわないようにするため）"
            node scripts/check/gate.mjs --ledger "$REVIEW_LEDGER" --html "$REVIEW_HTML" --result gate-result.json --acknowledge-low-volume
            DECISION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('gate-result.json','utf8')).decision)")
            if [ "$DECISION" = "PUBLISH_READY" ]; then
              TARGET_WEEK_COMPACT="${TARGET_WEEK_START//-/}"
              mkdir -p "data/ledger" "output"
              cp "$REVIEW_LEDGER" "data/ledger/${TARGET_WEEK_START}.json"
              cp "$REVIEW_HTML" "output/ea-weekly-${TARGET_WEEK_COMPACT}.html"
              git config user.name "ea-weekly-bot"
              git config user.email "actions@users.noreply.github.com"
              git add output/ data/ docs/
              git diff --cached --quiet || git commit -m "weekly report ${TARGET_WEEK_START}（レビュー済み台帳を確認のうえ公開、再収集なし）"
              git push
              echo "promoted=true" >> "$GITHUB_OUTPUT"
              echo "レビュー済み台帳をそのまま本番へ昇格しました（collect.mjsは実行していません）"
            else
              echo "レビュー済み台帳の再gate判定がPUBLISH_READYになりませんでした（decision=${DECISION}）。想定外のため公開を見送ります。"
              echo "promoted=false" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          else
            echo "レビュー済みの台帳・HTML（${REVIEW_LEDGER} / ${REVIEW_HTML}）が見つかりません。通常のpipelineで新規に収集・判定します"
            echo "promoted=false" >> "$GITHUB_OUTPUT"
          fi
      # 2026-08-15: 検証パイプラインをPython+Playwrightから移設した際にsetup-python/pipを撤去し、
      # Node.js一本（.github/workflows/ci.ymlと同一ランタイム）に統一した
      # （docs/validate-scripts-guide.md参照）。collect→build-ledger→renderの3ステップは
      # task #13後継の実データ接続（しょうさん指示2026-08-15）で配線済み（scripts/collect.mjs・
      # scripts/build-ledger.mjs・scripts/render.mjs）。renderステップの--narrativeは指定しない
      # （heroSummary/heroPillsはしょうさん確定仕様2026-08-15の自動生成ルールで生成する。
      # scripts/render.mjsのautoHeroSummary/autoHeroPills参照。人手キュレーションが必要な場合のみ
      # --narrativeで上書き可能）。発表枠の束ね（bundle_id、task #34）も配線済み。
      # 2026-10-08追加: 上のpromoteステップが既にレビュー済み内容を昇格済み（promoted:true）の
      # 場合はここでの再収集は行わない（二重処理防止・ドリフト防止の本体）
      - name: pipeline
        if: steps.idempotency.outputs.already_generated == 'false' && steps.promote.outputs.promoted != 'true'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          TARGET_WEEK_START="${{ steps.idempotency.outputs.target_week_start }}"
          GATE_ACK_FLAG=""
          if [ "${{ github.event.inputs.acknowledge_low_volume }}" = "true" ]; then
            GATE_ACK_FLAG="--acknowledge-low-volume"
          fi
          node scripts/collect.mjs
          node scripts/build-ledger.mjs
          node scripts/render.mjs "data/ledger/${TARGET_WEEK_START}.json" --out "output/ea-weekly-${TARGET_WEEK_START//-/}.html"
          node scripts/check/gate.mjs --ledger "data/ledger/${TARGET_WEEK_START}.json" --html "output/ea-weekly-${TARGET_WEEK_START//-/}.html" --result gate-result.json $GATE_ACK_FLAG
      # 2026-10-03追加（しょうさん指摘item3続き: 12/28週[年末年始]のような正当に件数が少ない週は
      # gate判定がREVIEW_REQUIRED[監査エラーは無く件数下限のみ抵触]になるが、確認後に公開する
      # 手段がworkflow_dispatchに無かった）。REVIEW_REQUIREDの場合、render済みの台帳・HTMLを
      # 本番パス（data/ledger/<週>.json・output/ea-weekly-<週>.html）とは別のoutput/review/配下へ
      # コピーしmainへコミットする。しょうさんはraw.githubusercontent.com経由でこの内容を確認でき、
      # 妥当であればacknowledge_low_volume:trueで再実行することで正式公開できる（この時点では
      # pipelineが失敗[exit 3]扱いのため後続のcommit outputsはスキップされ、本番パスは更新されない。
      # HOLD[監査エラーあり]の場合はこのステップは何もしない＝確認用ファイルも出力しない）。
      # 2026-10-08追加: 台帳もコミットするようにした（HTMLのみでは、上のpromoteステップが
      # 再収集せず昇格するための元データが無い）
      - name: REVIEW_REQUIREDの場合、確認用の台帳・HTMLを本番とは別パスへコミット
        if: always() && steps.idempotency.outputs.already_generated == 'false' && steps.promote.outputs.promoted != 'true'
        run: |
          TARGET_WEEK_START="${{ steps.idempotency.outputs.target_week_start }}"
          HTML_PATH="output/ea-weekly-${TARGET_WEEK_START//-/}.html"
          LEDGER_PATH="data/ledger/${TARGET_WEEK_START}.json"
          DECISION=""
          if [ -f gate-result.json ]; then
            DECISION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('gate-result.json','utf8')).decision)")
          fi
          if [ "$DECISION" = "REVIEW_REQUIRED" ] && [ -f "$HTML_PATH" ] && [ -f "$LEDGER_PATH" ]; then
            mkdir -p output/review
            cp "$HTML_PATH" "output/review/ea-weekly-${TARGET_WEEK_START//-/}.html"
            cp "$LEDGER_PATH" "output/review/ledger-${TARGET_WEEK_START}.json"
            git config user.name "ea-weekly-bot"
            git config user.email "actions@users.noreply.github.com"
            git add output/review/
            if ! git diff --cached --quiet; then
              git commit -m "review: ea-weekly-${TARGET_WEEK_START}（REVIEW_REQUIRED、件数下限要確認）"
              git push
              echo "確認用の台帳・HTMLをコミットしました: output/review/ea-weekly-${TARGET_WEEK_START//-/}.html, output/review/ledger-${TARGET_WEEK_START}.json"
            fi
          fi
      - name: commit outputs
        if: steps.idempotency.outputs.already_generated == 'false' && success()
        run: |
          git config user.name "ea-weekly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/ data/ docs/
          git diff --cached --quiet || git commit -m "weekly report $(date -u +%Y-%m-%d)"
          git push
      # 2026-10-03追加（しょうさん指摘、10/5週本番・保険cron両方HOLDのインシデント対策）:
      # pipelineまたはcommit outputsが失敗した場合（冪等チェックでスキップされた場合は対象外。
      # その場合はどちらのステップも実行されず失敗もしない）、GitHub Issueを自動作成する。
      # どのステップで止まったかはgate-result.json・data/ledger/<週>.jsonの有無から推定する
      # （scripts/check/create-pipeline-failure-issue.mjs参照）。同一対象週につき1件のみ作成
      # （monday-ff-cross-checkのcreate-discrepancy-issue.mjsと同じマーカー方式）
      - name: パイプライン失敗をGitHub Issueとして自動作成（失敗した場合のみ）
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check/create-pipeline-failure-issue.mjs "${{ steps.idempotency.outputs.target_week_start }}" gate-result.json
      # 2026-10-08追加: deploy-pagesが参照する最終HEAD SHA（上記のpromote/commit outputs等が
      # pushしていれば新しいコミット、何もpushしていなければ変化していない元のHEAD）を
      # 常に記録する（if: always()。失敗時も記録する必要があるかは無いが、記録自体を失敗させない）
      - name: deploy-pages向けに最終的なHEAD SHAを記録
        id: final_sha
        if: always()
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  # GitHub Pagesプレビュー公開（task #42、2026-08-17実装）。output/配下の配信済みレポートのみを
  # 一覧ページ（scripts/render/build-pages-index.js）と共に公開する。config/scripts等の内部
  # ファイルは含めない。しょうさん側の前提: リポジトリSettings→Pages→Source を
  # 「GitHub Actions」に設定しておくこと（docs/setup-guide.md参照）
  #
  # 2026-10-08修正（しょうさん指摘、実インシデント: 10/5週の本番・保険cronが両方HOLDし、
  # 唯一成功した手動workflow_dispatch[10/3 12:30 JST頃]のあとPagesが9/28週止まりのまま
  # 更新されなかった）。actions/checkoutがref未指定だとgithub.sha（このworkflow runが
  # 起動した時点のコミット）を使うため、buildジョブがcommit outputs等で新たにpushした
  # コミットを反映しないまま、1週遅れの内容でPagesを生成してしまうバグがあった（実際の
  # 実行ログでpages_build_versionがpushの前のコミットSHAのままだったことを確認済み）。
  # 通常は32分後の保険cronが新しいgithub.shaで起動し直すことで結果的に正しく再デプロイされ
  # 隠れていたが、本番・保険とも失敗し手動1回のみの実行だった今回は遅れが残り続けた。
  # 対策として、buildジョブが記録したfinal_sha（このworkflow run内での最終的なHEAD）を
  # 明示的にチェックアウトすることで、どの経路でも常に最新のoutput/を反映するようにした
  # （buildジョブの各種push分岐[pipeline成功・promote・保険cronのスキップ等]が増えても、
  # 「buildジョブ終了時点のHEAD」を素直に参照するだけで良いため、今後の回帰も防げる）。
  # deploy_pages_only指定時はbuildジョブ自体がスキップされるため、final_shaが無く
  # 空文字列になる。その場合は単純にmainの現在のHEADを使う
  deploy-pages:
    needs: build
    if: needs.build.result == 'success' || github.event.inputs.deploy_pages_only == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.final_sha || 'main' }}
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - run: npm ci
      - name: pages-dist生成
        run: node scripts/render/build-pages-dist.mjs output pages-dist
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist
      - id: deployment
        uses: actions/deploy-pages@v5

  # SPEC §3.3「月曜事後突合」（task #39、2026-08-17実データで初回実行・動作確認済み）。
  # 対象週が実際の当該週になった月曜朝、ff_calendar_thisweek.json（この時点では対象週分を
  # 指す。docs/phase0-findings.md 項目2の実測で確認済み）と土曜配信済みの台帳
  # （data/ledger/<この週の月曜>.json）を突合する。相違ゼロなら静かに成功、相違があれば
  # discrepancy-report.jsonを出力してジョブを失敗させる（失敗＝GitHub Actionsの標準通知で
  # しょうさんへ届く。ジョブ失敗は自動配信のstatusには影響しない=別ジョブのため）。
  # 2026-09-26追加（しょうさん指示: 9/21週の突合失敗が「ジョブ失敗」としてしか気づけず、
  # 中身を見るには手動でActionsログを掘る必要があったための対策）: 相違・欠落があった場合、
  # 内容をそのままGitHub Issueとして自動作成する（create-discrepancy-issue.mjs、同一週の
  # 重複作成なし）。issues: write が必要なため、ワークフロー全体のpermissions（contents: write
  # のみ）とは別にこのジョブだけpermissionsを上書きする（job-level permissionsは
  # workflow-levelとマージではなく置き換えのため、contents: readも明示する）
  monday-ff-cross-check:
    if: github.event.schedule == '23 23 * * 0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - run: npm ci
      - name: FF月曜事後突合
        run: |
          WEEK_MONDAY=$(node -e "console.log(require('./scripts/lib/dates').getCurrentWeekMonday())")
          echo "week_monday=${WEEK_MONDAY}"
          node scripts/check/ff-cross-check.mjs "data/ledger/${WEEK_MONDAY}.json" --result discrepancy-report.json
      - name: Upload discrepancy report（相違があった場合のみ生成される）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: discrepancy-report
          path: discrepancy-report.json
          retention-days: 14
          if-no-files-found: ignore
      - name: 相違・欠落をGitHub Issueとして自動作成（相違があった場合のみ）
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check/create-discrepancy-issue.mjs discrepancy-report.json
