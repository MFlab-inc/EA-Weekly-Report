# 一時ワークフロー（2026-09-26）: 9/21週FF月曜事後突合の失敗内容（discrepancy-report.json）を
# 公式サイトで裏取りする（scripts/phase1/source-recon-o.mjs）。確認完了後、このファイルと
# .ff-discrepancy-recon-triggerは削除する（source-recon-o.mjs自体は監査記録として残す）。
name: ff-discrepancy-recon
on:
  push:
    paths:
      - '.ff-discrepancy-recon-trigger'
jobs:
  recon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '20' }
      - run: node scripts/phase1/source-recon-o.mjs
