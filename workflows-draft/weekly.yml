# 週次レポート自動生成（ドラフト）
# 実装完了までは workflows-draft/ に置く（この場所ではActionsは起動しない）。
# Phase 2で .github/workflows/weekly.yml へ移設して有効化する。
name: weekly-report
on:
  schedule:
    - cron: '6 23 * * 5'    # 土曜 08:06 JST（本番）
    - cron: '41 23 * * 5'   # 土曜 08:41 JST（保険。冪等ガードで二重生成防止）
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: weekly-report
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Install Playwright Chromium (モバイル多幅レイアウト検証に使用)
        run: npx playwright install --with-deps chromium
      # 2026-08-15: 検証パイプラインをPython+Playwrightから移設した際にsetup-python/pipを撤去し、
      # Node.js一本（.github/workflows/ci.ymlと同一ランタイム）に統一した
      # （docs/validate-scripts-guide.md参照）。
      # TODO(Claude Code): scripts/checkers/harness.mjsのrunChecks()結果をscripts/lib/build-ledger.jsへ
      # 渡すcollectステップのCLIエントリ、およびrenderステップ（ledger→weekInput変換込み）が未実装。
      # 現時点で実装済みなのは check（scripts/checkers/harness.mjs）と
      # gate（scripts/check/gate.mjs、ledger×HTML突合・ポリシーlint・モバイル多幅レイアウトを集約）。
      - name: pipeline
        run: |
          node scripts/collect.js
          node scripts/build-ledger.js
          node scripts/render.js
          node scripts/check/gate.mjs --ledger "data/ledger/$(node -e "console.log(require('./scripts/lib/dates').getTargetWeek().targetWeekStart)").json" --html "output/ea-weekly-$(node -e "console.log(require('./scripts/lib/dates').getTargetWeek().targetWeekStart.replace(/-/g,''))").html" --result gate-result.json
      - name: commit outputs
        if: success()
        run: |
          git config user.name "ea-weekly-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/ data/ docs/
          git diff --cached --quiet || git commit -m "weekly report $(date -u +%Y-%m-%d)"
          git push
