    <div id="pageViewData" data-value="{&quot;ID&quot;:&quot;637&quot;,&quot;Title&quot;:&quot;Release calendar&quot;,&quot;ClassName&quot;:&quot;ReleaseCalendar&quot;,&quot;BackgroundColor&quot;:&quot;white&quot;,&quot;Content&quot;:&quot;&lt;p&gt;&lt;span&gt;The release calendar lists published and upcoming releases of official statistics. It includes regular, scheduled information releases only.&lt;\/span&gt;&lt;\/p&gt;\n&lt;p&gt;Most releases are published at 10:45am. We aim to make release pages and files available as soon as possible, but heavy traffic can sometimes delay this by a few minutes. If you don\u2019t see a release straight away, please check again shortly. We are actively working to address the issue and minimise these delays.&lt;\/p&gt;\n&lt;p&gt;If you&#039;d prefer not to wait, you can &lt;a href=\&quot;\/services\/subscribe-to-information-release-notifications\/\&quot;&gt;sign up for email notifications&lt;\/a&gt; to receive key facts from our releases directly. These emails are sent as soon as information is published and are not affected by website traffic.&lt;\/p&gt;\n&lt;p&gt;&lt;a class=\&quot;ss-broken\&quot; href=\&quot;\/release-calendar\/#other\&quot;&gt;Other publications we\u2019re working on&lt;\/a&gt;&amp;nbsp;are listed in a table underneath the release calendar. They are one-off reports and other publications that aren&#039;t information releases.&lt;\/p&gt;\n&lt;p&gt;Read &lt;a href=\&quot;\/about-us\/legislation-policies-and-guidelines\/information-releases-embargoes-and-sanctions\/\&quot;&gt;Information releases, embargoes, and sanctions&lt;\/a&gt; to understand why media conferences are held and the special conditions under which they are run.&lt;\/p&gt;&quot;,&quot;BottomContent&quot;:&quot;&lt;div&gt;\n&lt;h2&gt;Upcoming publications for the next census&lt;\/h2&gt;\n&lt;p&gt;This table lists reports and other publications about the next census.&lt;\/p&gt;\n&lt;table class=\&quot;stats-striped\&quot; style=\&quot;border-collapse: collapse; width: 100%; white-space: normal; margin-bottom: 1.474rem;\&quot;&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Date&lt;\/strong&gt;&lt;\/td&gt;\n&lt;td&gt;&lt;strong&gt;Publication title&lt;\/strong&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;TBC*&lt;\/td&gt;\n&lt;td&gt;Census strategy \u2013 transitioning to the new model&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;TBC*&lt;\/td&gt;\n&lt;td&gt;Final primary content for the next census&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;TBC*&lt;\/td&gt;\n&lt;td&gt;Proposed data collection approach and content for the next census \u2013 summary of submissions&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;TBC*&lt;\/td&gt;\n&lt;td&gt;Census high-level design&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;TBC*&lt;\/td&gt;\n&lt;td&gt;Transitional admin data statistics for census: Population measures 2025&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;\n&lt;\/div&gt;\n&lt;p&gt;&lt;span class=\&quot;u-font-size-small\&quot;&gt;&lt;strong&gt;*To be confirmed.&lt;\/strong&gt; Due to progress of the Data and Statistics (Census) Amendment Bill, the timing for the above reports and publications will be reconfirmed to align with the process. See &lt;a href=\&quot;\/news\/modernising-the-census-data-and-statistics-census-amendment-bill-update\/\&quot;&gt;Modernising the census \u2013 Data and Statistics (Census) Amendment Bill update&lt;\/a&gt;.&lt;\/span&gt;&lt;\/p&gt;\n&lt;h2&gt;New Zealand activity index (NZAC)&lt;\/h2&gt;\n&lt;p&gt;The NZAC is a composite index that tracks movements in the New Zealand economy from month to month. See &lt;a href=\&quot;\/indicators\/new-zealand-activity-index\/\&quot;&gt;New Zealand activity index&lt;\/a&gt; for more information about the index.&lt;\/p&gt;\n&lt;table class=\&quot;stats-striped\&quot; style=\&quot;border-collapse: collapse; width: 100%; white-space: normal; margin-bottom: 1.474rem;\&quot;&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Next update&lt;\/strong&gt;&lt;\/td&gt;\n&lt;td&gt;&lt;strong&gt;Indicator&lt;\/strong&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;27 August 2026&lt;\/td&gt;\n&lt;td&gt;New Zealand activity index (NZAC) \u2013 includes July 2026 data&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;h2&gt;&lt;a name=\&quot;other\&quot;&gt;&lt;\/a&gt;Other publications we\u2019re working on&lt;\/h2&gt;\n&lt;p&gt;This table lists one-off reports and other publications Stats NZ is working on.&lt;\/p&gt;\n&lt;p&gt;The publications are ordered by planned publication date. Those likely to be published soonest are at the top. All dates are subject to change.&lt;\/p&gt;\n&lt;p&gt;Go to &lt;a href=\&quot;https:\/\/www.stats.govt.nz\/publications\&quot;&gt;Publications &lt;\/a&gt;to find the papers once we&#039;ve published them. Here you can filter by content type (eg report, methods, news) and topic.&lt;\/p&gt;\n&lt;table class=\&quot;stats-striped\&quot; style=\&quot;border-collapse: collapse; width: 100%; white-space: normal; margin-bottom: 1.474rem;\&quot;&gt;\n&lt;tbody&gt;\n&lt;tr&gt;\n&lt;td&gt;&lt;strong&gt;Planned publishing date&lt;\/strong&gt;&lt;\/td&gt;\n&lt;td&gt;&lt;strong&gt;Working title&lt;\/strong&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;31 August 2026&lt;\/td&gt;\n&lt;td&gt;Monthly consumers price index \u2013 updates on progress&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;1 September 2026&lt;\/td&gt;\n&lt;td&gt;International trade: June 2026 quarter \u2013 improvements and updates&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;14 September 2026&lt;\/td&gt;\n&lt;td&gt;2026 balance of payments and national accounts \u2013 improvements and updates&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;September 2026&lt;\/td&gt;\n&lt;td&gt;Economic snapshot: June 2026 quarter&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;8 October 2026&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;National accounts (income, saving, assets, and liabilities): June 2026 quarter \u2013 experimental&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;8 October 2026&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;Price index methods \u2013 updates for the September 2026 quarter&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;29 October 2026&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;Developing a methodology to measure persistent child poverty using survey and admin data \u2013 update&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;October 2026&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;New Zealand\u2019s environmental reporting series: Our atmosphere and climate 2026&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;October 2026*&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;Atmospheric ozone: Data to 2025&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;October 2026*&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;Drought and wet periods: Data to 2025&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;October 2026*&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;El Ni\u00f1o Southern Oscillation: Data to 2025&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;October 2026*&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;Extreme rainfall: Data to 2025&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;October 2026*&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;Extreme wind: Data to 2025&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;October 2026*&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;Frost and growing degree days: Data to 2025&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;October 2026*&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;Greenhouse gas concentrations: Data to 2025&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;October 2026*&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;Rainfall: Data to 2025&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;October 2026*&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;Sunshine hours: Data to 2025&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;October 2026*&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;Temperature: Data to 2025&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;6 November 2026&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;2026 preview of national accounts improvements and updates&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;24 November 2026&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;Improvements to gross domestic product September 2026 quarter&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;15 January 2027&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;National accounts (income, saving, assets, and liabilities): September 2026 quarter \u2013 experimental&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;20 January 2027&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;Price index methods \u2013 updates for the December 2026 quarter&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;tr&gt;\n&lt;td&gt;&amp;nbsp;&lt;\/td&gt;\n&lt;td&gt;&lt;span&gt;*Timing of environmental indicators is subject to change due to the availability of data inputs.&lt;br&gt;&lt;\/span&gt;&lt;\/td&gt;\n&lt;\/tr&gt;\n&lt;\/tbody&gt;\n&lt;\/table&gt;\n&lt;p&gt;&amp;nbsp;&lt;\/p&gt;\n&lt;p&gt;If you have questions about these publications, email our Information Centre: &lt;a href=\&quot;mailto:info@stats.govt.nz\&quot;&gt;info@stats.govt.nz&lt;\/a&gt;&lt;\/p&gt;&quot;,&quot;PageBreadcrumbs&quot;:[{&quot;Title&quot;:&quot;Home&quot;,&quot;MenuTitle&quot;:&quot;Home&quot;,&quot;Link&quot;:&quot;\/&quot;},{&quot;Title&quot;:&quot;Release calendar&quot;,&quot;MenuTitle&quot;:&quot;Release calendar&quot;,&quot;Link&quot;:&quot;\/release-calendar\/&quot;}],&quot;MetaDescription&quot;:&quot;Add our upcoming information releases to your calendar, and see what other publications we&#039;re working on.&quot;,&quot;MonthRange&quot;:{&quot;max&quot;:&quot;2027-02&quot;,&quot;min&quot;:&quot;2012-07&quot;},&quot;PageLink&quot;:&quot;\/release-calendar\/&quot;,&quot;DateTaxon
