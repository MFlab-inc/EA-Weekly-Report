e by sex, seasonally adjusted, June 2012\u2013June 2026 quarters&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;134538&quot;,&quot;Title&quot;:&quot;Labour market statistics: June 2026 quarter \u2013 key facts 4&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;The number of underutilised people was 440,000, compared with 408,000 last quarter. The total for this quarter consisted of 234,000 women and 206,000 men.&lt;\/p&gt;\n&lt;p&gt;Underutilisation is a broad measure of spare capacity in the labour market and is just as important as the unemployment rate, as it gives us a more detailed picture of the workforce.&lt;\/p&gt;\n&lt;p&gt;&lt;img width=\&quot;900\&quot; height=\&quot;554\&quot; alt=\&quot;Diagram shows underutilisation in the June 2026 quarter, seasonally adjusted. There&amp;#039;s a link below it to a full explanation.\&quot; src=\&quot;\/assets\/Uploads\/Labour-market-statistics\/Labour-market-statistics-June-2026-quarter\/Download-data\/uu_lm_summary__ResizedImageWzkwMCw1NTRd.png\&quot; loading=\&quot;lazy\&quot; class=\&quot;leftAlone ss-htmleditorfield-file image\&quot;&gt;\n\n&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/information-releases\/labour-market-statistics-june-2026-quarter\/#text-alt\&quot;&gt;Text alternative for diagram Total underutilisation, June 2026 quarter, seasonally adjusted.&lt;\/a&gt;&lt;\/p&gt;\n&lt;p&gt;The following data is not seasonally adjusted.&lt;\/p&gt;\n&lt;p&gt;In the June 2026 quarter, the underutilisation rate was:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;22.8 percent for M\u0101ori&lt;\/li&gt;\n&lt;li&gt;22.1 percent for Pacific peoples&lt;\/li&gt;\n&lt;li&gt;12.5 percent for Asians&lt;\/li&gt;\n&lt;li&gt;11.8 percent for Europeans.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;The underutilisation rate for M\u0101ori increased to 22.8 percent, from 19.5 percent a year earlier.&lt;\/p&gt;\n&lt;p&gt;In the June 2026 quarter, compared with the June 2025 quarter, there were:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;180,200 underutilised people aged 15 to 24, up from 158,600 a year earlier&lt;\/li&gt;\n&lt;li&gt;75,500 underutilised people aged 25 to 34, up from 63,600 a year earlier.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Underutilisation in the North Island increased to 13.9 percent in the June 2026 quarter, from 12.5 percent a year earlier. In the South Island, the underutilisation rate was 11.9 percent.&lt;\/p&gt;\n&lt;h2&gt;Employment&lt;\/h2&gt;\n&lt;p&gt;The seasonally adjusted employment rate was 66.7 percent in the June 2026 quarter, unchanged from the March 2026 quarter.&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For men, the employment rate was 70.5 percent, compared with 70.4 percent last quarter.&lt;\/li&gt;\n&lt;li&gt;For women, the employment rate was unchanged at 63.1 percent.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;134514&quot;,&quot;Title&quot;:&quot;LMS June 26 qtr \u2013 g2 \u2013 Employment rate by sex, seasonally adjusted, June 2012\u2013June 2026 quarters&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:35644,&quot;Title&quot;:&quot;Employment rate by sex, seasonally adjusted, June 2012\u2013June 2026 quarters&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;Quarter,Jun-12,Sept-12,Dec-12,Mar-13,Jun-13,Sept-13,Dec-13,Mar-14,Jun-14,Sept-14,Dec-14,Mar-15,Jun-15,Sept-15,Dec-15,Mar-16,Jun-16,Sept-16,Dec 00, compared with 2,892,000 in the March 2026 quarter.&lt;\/p&gt;\n&lt;h2&gt;Labour force participation&lt;\/h2&gt;\n&lt;p&gt;The seasonally adjusted labour force participation rate was 70.7 percent in the June 2026 quarter, compared with 70.4 percent in the March 2026 quarter.&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;For men, the labour force participation rate was 74.7 percent, compared with 74.4 percent last quarter.&lt;\/li&gt;\n&lt;li&gt;For women, the labour force participation rate was 66.7 percent, compared with 66.6 percent last quarter.&lt;\/li&gt;\n&lt;\/ul&gt;&quot;},{&quot;ID&quot;:&quot;134517&quot;,&quot;Title&quot;:&quot;LMS June 26 qtr \u2013 g5 \u2013 Labour force participation rate by sex, seasonally adjusted, June 2012\u2013June 2026 quarters&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:35647,&quot;Title&quot;:&quot;Labour force participation rate by sex, seasonally adjusted, June 2012\u2013June 2026 quarters&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;Quarter,Jun-12,Sept-12,Dec-12,Mar-13,Jun-13,Sept-13,Dec-13,Mar-14,Jun-14,Sept-14,Dec-14,Mar-15,Jun-15,Sept-15,Dec-15,Mar-16,Jun-16,Sept-16,Dec-16,Mar-17,Jun-17,Sept-17,Dec-17,Mar-18,Jun-18,Sept-18,Dec-18,Mar-19,Jun-19,Sept-19,Dec-19,Mar-20,Jun-20,Sept-20,Dec-20,Mar-21,Jun-21,Sept-21,Dec-21,Mar-22,Jun-22,Sept-22,Dec-22,Mar-23,Jun-23,Sept-23,Dec-23,Mar-24,Jun-24,Sept-24,Dec-24,Mar-25,Jun-25,Sept-25,Dec-25,Mar-26,Jun-26\r\nMen,73.7,73.5,73.1,72.6,73.1,73.9,74.1,74.4,74.3,74,74.7,75.1,74.7,74,74,74.5,75.5,76,76.2,76.5,76.3,76.6,76.6,76.4,76.5,76.3,76,75.4,75.4,75.5,75.4,75.9,75.1,75.4,75.4,75.6,75.6,75.6,75.5,75.7,75.3,76,76.5,76.6,76.9,76.7,76.5,75.8,75.9,75.3,75.1,75,74.6,74.5,74.3,74.4,74.7\r\nWomen,62.6,62.6,62.3,62.1,62.2,62.7,62.8,63.2,62.7,63.4,64.2,63.9,63.7,63,63,63.7,64.8,64.5,65.4,65.5,64.7,65.9,66,66,66.1,66,65.9,65.8,66,65.9,65.5,65.7,65,64.9,65.1,65.4,65.7,66.7,66.6,66.4,66.6,67.5,67.2,67.8,68,67.4,67.3,67.2,67.3,67,66.7,66.5,66.4,66.2,66.9,66.6,66.7\r\nTotal,68,67.9,67.5,67.2,67.5,68.1,68.3,68.6,68.3,68.6,69.3,69.4,69.1,68.4,68.3,69,70,70.1,70.7,70.9,70.4,71.2,71.2,71.1,71.2,71.1,70.9,70.6,70.6,70.6,70.4,70.7,70,70.1,70.2,70.4,70.6,71.1,71,71,70.9,71.7,71.8,72.1,72.4,72,71.8,71.5,71.6,71.1,70.8,70.7,70.5,70.3,70.5,70.4,70.7\r\n&quot;}],&quot;GraphType&quot;:&quot;line&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;Labour force participation rate by sex, seasonally adjusted, June 2012\u2013June 2026 quarters&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; &quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;134540&quot;,&quot;Title&quot;:&quot;Labour market statistics: June 2026 quarter \u2013 key facts 6&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;A total of 1,277,000 people were not in the labour force (NILF) this quarter, compared with 1,283,000 last quarter.&lt;\/p&gt;\n&lt;h2&gt;Youth not in employment, education, or training (NEET)&lt;\/h2&gt;\n&lt;p&gt;In the June 2026 quarter, the seasonally adjusted proportion of people aged 15 to 24 who were not in employment, education, or training (NEET) was 13.8 percent, compared with 14.4 percent in the March 2026 quarter.&lt;\/p&gt;\n&lt;p&gt;The seasonally adjusted NEET rate was:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;12.5 percent for males aged 15 to 19, compared with 11.1 percent last quarter&lt;\/li&gt;\n&lt;li&gt;15.2 percent for males aged 20 to 24, compared with 16.2 percent last quarter&lt;\/li&gt;\n&lt;li&gt;9.7 percent for females aged 15 to 19, compared with 10.9 percent last quarter&lt;\/li&gt;\n&lt;li&gt;18.5 percent for females aged 20 to 24, compared with 20.1 percent last quarter.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;h2&gt;Disability&lt;\/h2&gt;\n&lt;p&gt;The following data is not seasonally adjusted.&lt;\/p&gt;\n&lt;p&gt;In the June 2026 quarter, for people aged 15 to 64, the:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;labour force participation rate for disabled people was 41.7 percent, compared with 83.1 percent for non-disabled people&lt;\/li&gt;\n&lt;li&gt;employment rate for disabled people was 36.4 percent, compared with 78.4 percent for non-disabled people&lt;\/li&gt;\n&lt;li&gt;unemployment rate for disabled people was 12.8 percent, compared with 5.7 percent for non-disabled people&lt;\/li&gt;\n&lt;li&gt;underutilisation rate for disabled people was 30.0 percent, compared with 13.6 percent for non-disabled people.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Between the June 2025 and 2026 quarters, there were no statistically significant changes in the headline rates or levels for disabled people aged 15 to 64. The relatively small number of disabled people in the working-age population means changes over time for this group are rarely statistically significant.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;\/information-releases\/labour-market-statistics-june-2026-quarter\/#download-data\&quot; class=\&quot;ss-broken\&quot;&gt;Labour market statistics: June 2026 quarter \u2013 CSV&lt;\/a&gt;, available under \u2018Download data\u2019 above, includes labour market data for disabled people by sex and age. We will continue to include this data in future June-quarter labour market and income releases.&lt;\/p&gt;\n&lt;h2&gt;Wages&lt;\/h2&gt;\n&lt;p&gt;The labour cost index (LCI) all salary and wage rates (including overtime) increased 2.0 percent in the year ended June 2026, while the unadjusted LCI increased 3.1 percent.&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Private sector wages increased 2.0 percent over the year.&lt;\/li&gt;\n&lt;li&gt;Public sector wages increased 1.7 percent over the year.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;The LCI is often compared with the consumers price index (CPI) to see how wage inflation compares with consumer inflation (the change in prices of goods and services bought by households). Annual CPI inflation was 4.1 percent in the year ended June 2026.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;134516&quot;,&quot;Title&quot;:&quot;LMS June 26 qtr \u2013 g4 \u2013 LCI and CPI, annual percentage change, June 2006\u2013June 2026 quarters&quot;,&quot;ClassName&quot;:&quot;GraphTableBlock&quot;,&quot;ShowBlockTitle&quot;:0,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;xAxisTitle&quot;:null,&quot;yAxisTitle&quot;:&quot;Percent&quot;,&quot;yAxisDualRightTitle&quot;:null,&quot;GraphMetadata&quot;:null,&quot;SeriesData&quot;:[{&quot;ID&quot;:35646,&quot;Title&quot;:&quot;LCI and CPI, annual percentage change, June 2006\u2013June 2026 quarters&quot;,&quot;ClassName&quot;:&quot;SeriesGroup&quot;,&quot;Type&quot;:&quot;line&quot;,&quot;GraphCsvData&quot;:&quot;\ufeffQuarter,Jun-06,Sept-06,Dec-06,Mar-07,Jun-07,Sept-07,Dec-07,Mar-08,Jun-08,Sept-08,Dec-08,Mar-09,Jun-09,Sept-09,Dec-09,Mar-10,Jun-10,Sept-10,Dec-10,Mar-11,Jun-11,Sept-11,Dec-11,Mar-12,Jun-12,Sept-12,Dec-12,Mar-13,Jun-13,Sept-13,Dec-13,Mar-14,Jun-14,Sept-14,Dec-14,Mar-15,Jun-15,Sept-15,Dec-15,Mar-16,Jun-16,Sept-16,Dec-16,Mar-17,Jun-17,Sept-17,Dec-17,Mar-18,Jun-18,Sept-18,Dec-18,Mar-19,Jun-19,Sept-19,Dec-19,Mar-20,Jun-20,Sept-20,Dec-20,Mar-21,Jun-21,Sept-21,Dec-21,Mar-22,Jun-22,Sept-22,Dec-22,Mar-23,Jun-23,Sept-23,Dec-23,Mar-24,Jun-24,Sept-24,Dec-24,Mar-25,Jun-25,Sept-25,Dec-25,Mar-26,Jun-26\r\nCPI \u2013 all groups,4,3.5,2.6,2.5,2,1.8,3.2,3.4,4,5.1,3.4,3,1.9,1.7,2,2,1.7,1.5,4,4.5,5.3,4.6,1.8,1.6,1,0.8,0.9,0.9,0.7,1.4,1.6,1.5,1.6,1,0.8,0.3,0.4,0.4,0.1,0.4,0.4,0.4,1.3,2.2,1.7,1.9,1.6,1.1,1.5,1.9,1.9,1.5,1.7,1.5,1.9,2.5,1.5,1.4,1.4,1.5,3.3,4.9,5.9,6.9,7.3,7.2,7.2,6.7,6,5.6,4.7,4,3.3,2.2,2.2,2.5,2.7,3,3.1,3.1,4.1\r\nLCI \u2013 all salary and wage rates,3.1,3.2,3.2,3.2,3.3,3.1,3.3,3.4,3.6,4,3.5,3.3,2.8,2.1,1.8,1.5,1.6,1.6,1.7,1.9,1.9,2,2,2,2,1.9,1.8,1.7,1.7,1.7,1.6,1.6,1.7,1.6,1.8,1.7,1.6,1.6,1.5,1.6,1.5,1.6,1.6,1.6,1.7,1.9,1.8,1.8,1.9,1.8,1.9,2,2.1,2.4,2.6,2.5,2.1,1.9,1.6,1.6,2.1,2.4,2.6,3,3.4,3.7,4.1,4.3,4.3,4.3,4.3,4.1,4.3,3.8,3.3,2.9,2.4,2.1,2,2,2\r\n&quot;}],&quot;GraphType&quot;:&quot;line&quot;,&quot;Presentation&quot;:&quot;graphTable&quot;,&quot;GraphHeading&quot;:&quot;LCI and CPI, annual percentage change, June 2006\u2013June 2026 quarters&quot;,&quot;showLegend&quot;:true,&quot;SourceCredit&quot;:&quot;Stats NZ&quot;,&quot;Footnote&quot;:&quot; LCI \u2014 labour cost index; CPI \u2014 consumers price index&quot;,&quot;GeoLevelView&quot;:null,&quot;Action&quot;:{&quot;ActionText&quot;:null,&quot;ActionHref&quot;:{&quot;Url&quot;:&quot;&quot;,&quot;Target&quot;:&quot;_self&quot;}}},{&quot;ID&quot;:&quot;134543&quot;,&quot;Title&quot;:&quot;Labour market statistics: June 2026 quarter \u2013 key facts 7&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;p&gt;In the year ended June 2026, wages as measured by the Quarterly Employment Survey (QES) also grew. Average ordinary time hourly earnings increased to $44.62 (up 2.8 percent).&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Private sector ordinary time hourly earnings increased 3.0 percent, to $42.46.&lt;\/li&gt;\n&lt;li&gt;Public sector ordinary time hourly earnings increased 2.2 percent, to $52.59.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Average weekly earnings (including overtime) for full-time equivalent employees (FTEs) in the QES also increased over the year \u2013 up 3.0 percent to $1,730.&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;Private sector average weekly earnings increased 3.1 percent, to $1,642.&lt;\/li&gt;\n&lt;li&gt;Public sector average weekly earnings increased 2.9 percent, to $2,062.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;h2&gt;Data quality&lt;\/h2&gt;\n&lt;h3&gt;Data series correction for the Household Labour Force Survey&lt;strong&gt;&amp;nbsp;&lt;\/strong&gt;&lt;\/h3&gt;\n&lt;p&gt;We have discovered and corrected an error in our processing system for data relating to the reasons people worked fewer hours than usual in the reference week in the December 2025 and March 2026 quarters.&lt;\/p&gt;\n&lt;p&gt;Some respondents who worked fewer hours than usual were incorrectly coded to the \u2018Other reasons\u2019 category. These respondents have been reassigned to the appropriate categories and the revised data is included in the June 2026 quarter release.&lt;\/p&gt;\n&lt;p&gt;Infoshare series \u2018HLFQ.SVE - Persons employed by reason working fewer hours (main job) or absent (all jobs)\u2019 has been revised. We have removed this series from the downloadable CSV files in the affected quarters. We recommend instead accessing the most recent data from Infoshare or the June 2026 quarter downloadable CSV files.&lt;\/p&gt;\n&lt;h3&gt;Data series correction for Labour cost index&lt;\/h3&gt;\n&lt;p&gt;We have discovered and corrected an error for the \u2018Public sector, All industries combined, All salary and wage rates series - LCIQ.SG33Z9\u2019. This affected the December 2025 and March 2026 quarters. The index numbers for this series have been revised and now match the \u2018Public Sector, All occupations combined, All Salary and wages rates\u2019 index numbers for these quarters. The quarterly and annual percentage changes were not impacted.&lt;\/p&gt;\n&lt;p&gt;We recommend instead accessing the most recent data from Infoshare or the June 2026 quarter downloadable CSV files.&lt;\/p&gt;\n&lt;h3&gt;Sample rotation in the Quarterly Employment Survey&lt;\/h3&gt;\n&lt;p&gt;In the June 2026 quarter, the QES sample was rotated for the following industries:&lt;\/p&gt;\n&lt;ul&gt;\n&lt;li&gt;forestry&lt;\/li&gt;\n&lt;li&gt;electricity, gas, water, and waste services&lt;\/li&gt;\n&lt;li&gt;rental, hiring, and real estate services.&lt;\/li&gt;\n&lt;\/ul&gt;\n&lt;p&gt;Due to the rotation, the sampling error for quarterly movements in these industries is higher than in previous quarters. Movements in these industries should be interpreted alongside the accompanying sampling error information.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/example.org\/19f13c9d-878c-4055-88c1-5ad70a1169c0\&quot;&gt;Labour market statistics: June 2026 quarter \u2013 Period-specific information \u2013 DataInfo+&lt;\/a&gt; has more detail on the impact of sample rotation.&lt;\/p&gt;\n&lt;p&gt;We recommend that customers use the Quarterly Employment Survey primarily for estimates of average hours and earnings. For job measures, customers should instead rely on monthly &lt;a href=\&quot;https:\/\/www.stats.govt.nz\/information-releases\/?dateFiltersID=2718&amp;amp;filters=Employment%20indicators\&quot;&gt;Employment indicators&lt;\/a&gt; or &lt;a href=\&quot;https:\/\/www.stats.govt.nz\/information-releases\/?dateFiltersID=3578&amp;amp;filters=Business%20employment%20data\&quot;&gt;Business employment data&lt;\/a&gt;.&lt;\/p&gt;\n&lt;h5&gt;&lt;a id=\&quot;text-alt\&quot;&gt;&lt;\/a&gt;Text alternative for diagram Total underutilisation, June 2026 quarter, seasonally adjusted&lt;\/h5&gt;\n&lt;p&gt;The diagram shows data from the June 2026 quarter Household Labour Force Survey.&lt;\/p&gt;\n&lt;p&gt;The underutilisation rate was up 0.8pp (percentage points), to 13.8 percent. This rate is derived from the number of total underutilised divided by the extended labour force. The unemployment rate was up 0.2pp, to 5.6 percent. This is derived from the number of unemployed divided by the labour force.&lt;\/p&gt;\n&lt;p&gt;The number of total underutilised was up 31,000 to 440,000. The number of underemployed was up 9,000 to 154,000, while the number of unemployed was up 8,000 to 171,000. The potential labour force was up 14,000 to 115,000.&lt;\/p&gt;\n&lt;p&gt;Within the potential labour force, available potential jobseekers were up 14,700 to 95,100, and unavailable jobseekers were unchanged at 20,000.&lt;\/p&gt;\n&lt;p&gt;Notes:&lt;\/p&gt;\n&lt;ol&gt;\n&lt;li&gt;No seasonal pattern is evident for available potential jobseekers. Therefore, this series is not seasonally adjusted.&lt;\/li&gt;\n&lt;li&gt;Due to rounding, changes do not always sum to the published totals.&lt;\/li&gt;\n&lt;li&gt;All changes are quarterly.&lt;\/li&gt;\n&lt;\/ol&gt;\n&lt;p&gt;&lt;strong&gt;Source&lt;\/strong&gt;: Stats NZ, Household Labour Force Survey&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;133387&quot;,&quot;Title&quot;:&quot;Labour market statistics: March 2026 quarter \u2013 more data&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;More data&lt;\/h2&gt;\n&lt;p&gt;Use&lt;span&gt;&amp;nbsp;&lt;\/span&gt;&lt;a rel=\&quot;noopener noreferrer\&quot; href=\&quot;http:\/\/infoshare.stats.govt.nz\/\&quot; target=\&quot;_blank\&quot;&gt;Infoshare&lt;\/a&gt;&amp;nbsp;to access the labour market time series.&lt;\/p&gt;\n&lt;p&gt;Subject category:&amp;nbsp;Work income and spending&amp;nbsp;&lt;br&gt;Group:&amp;nbsp;Household labour force survey \u2013 HLF&lt;br&gt;Group: Quarterly employment survey \u2013 QEM&lt;br&gt;Group: Labour cost index \u2013 LCI&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;134566&quot;,&quot;Title&quot;:&quot;Labour market statistics: June 2026 quarter \u2013 metadata&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Definitions and metadata&lt;\/h2&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/item\/example.org\/19f13c9d-878c-4055-88c1-5ad70a1169c0\&quot;&gt;Labour market statistics: June 2026 quarter \u2013 Period-specific information \u2013 DataInfo+&lt;\/a&gt; includes data-quality notes for the June 2026 quarter, including response and achieved sample rates.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;http:\/\/datainfoplus.stats.govt.nz\/Item\/example.org\/438dbf04-3b3f-446a-b575-2f2df7d6531f?_ga=2.143153788.817057502.1619417816-730143600.1617836679\&quot;&gt;Labour market statistics \u2013 DataInfo+&lt;\/a&gt; gives general methodology used to produce this release, and related metadata.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;https:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/b7c39358-aa03-446f-a27d-91c37caac35d#\/nz.govt.stats\/6a13af44-0057-4a63-835a-c1a0c6f8ef91\&quot;&gt;Household Labour Force Survey \u2013 DataInfo+&lt;\/a&gt; gives general methodology used to produce Household Labour Force Survey statistics, and related metadata.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;http:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/9007195c-8dc3-4dfb-b5da-1b12c32e90ac?_ga=2.75913564.817057502.1619417816-730143600.1617836679\&quot;&gt;Labour cost index \u2013 DataInfo+&lt;\/a&gt; gives general methodology used to produce labour cost index statistics, and related metadata.&lt;\/p&gt;\n&lt;p&gt;&lt;a href=\&quot;http:\/\/datainfoplus.stats.govt.nz\/Item\/nz.govt.stats\/086258b1-90e6-4728-981d-756b3ca6e147?_ga=2.84375888.817057502.1619417816-730143600.1617836679\&quot;&gt;Quarterly Employment Survey \u2013 DataInfo+&lt;\/a&gt; gives general methodology used to produce Quarterly Employment Survey statistics, and related metadata.&lt;\/p&gt;&quot;},{&quot;ID&quot;:&quot;133962&quot;,&quot;Title&quot;:&quot;Infoshare is being replaced by Aotearoa Data Explorer&quot;,&quot;ClassName&quot;:&quot;TextBlock&quot;,&quot;ShowBlockTitle&quot;:false,&quot;DefaultView&quot;:&quot;Grid&quot;,&quot;Content&quot;:&quot;&lt;h2&gt;Infoshare is being replaced by Aotearoa Data Explorer&lt;\/h2&gt;\n&lt;p&gt;&lt;a id=\&quot;menurj4r\&quot; title=\&quot;htt
